apply plugin: "com.android.application"

android {
    namespace "ru.bacteria.online5"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "ru.bacteria.online5"
        minSdk 23
        targetSdk 36
        // Версию обязательно повышаем для каждой выкладываемой сборки.
        // Иначе Android не позволит установить её поверх уже установленной.
        versionCode 13
        versionName "0.2.1"
    }

    signingConfigs {
        // Пока игра обновляется с уже разосланной debug-сборки, сохраняем
        // тот же ключ подписи. Это позволяет установить обновление поверх
        // старой версии. Перед публикацией в магазин здесь нужно заменить
        // debug на постоянный release keystore.
        release {
            initWith signingConfigs.debug
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }
}
